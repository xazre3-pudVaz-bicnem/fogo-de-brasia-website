name: Daily Blog Post

# 毎日 11:30（日本時間）に記事を1本生成し、main へ直接コミットする。
# push された時点で Vercel が自動でビルド・公開する。
#
# 必要な GitHub Secret は ANTHROPIC_API_KEY のみ。
# 店舗情報・テーマ一覧は scripts/generate-daily-post.ts に持たせている。
on:
  schedule:
    # 02:30 UTC = 11:30 JST
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'テーマを指定する（空なら未使用テーマから自動選択）'
        required: false
        type: string
      model:
        description: '使用モデル（空なら claude-haiku-4-5-20251001）'
        required: false
        type: string

# 同時実行を防ぐ（push の競合を避ける）
concurrency:
  group: daily-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: 使用モデルを表示
        env:
          INPUT_MODEL: ${{ inputs.model }}
        run: |
          MODEL="${INPUT_MODEL:-claude-haiku-4-5-20251001}"
          echo "使用モデル: $MODEL"
          echo "実行日時 (JST): $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          echo "### 使用モデル: \`$MODEL\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 記事を生成
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.model }}
          BLOG_TOPIC: ${{ inputs.topic }}
        run: npm run blog:generate

      - name: 生成結果をコミットして push
        env:
          SLUG: ${{ steps.generate.outputs.slug }}
          FILE: ${{ steps.generate.outputs.file }}
          TITLE: ${{ steps.generate.outputs.title }}
          MODEL: ${{ steps.generate.outputs.model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/blog

          if git diff --cached --quiet; then
            echo "変更がないため、コミットせずに終了します。"
            echo "### 変更なし（コミットしませんでした）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "blog: ${TITLE}" -m "生成ファイル: ${FILE}" -m "使用モデル: ${MODEL}"

          # 通常はそのまま push できる。
          # 実行中に対象ブランチが進んでいた場合だけ、取り直してリベースする。
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "push に失敗したため、最新を取得してリベースします。"
            git fetch --unshallow origin "${GITHUB_REF_NAME}" \
              || git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          echo "push 完了: ${GITHUB_REF_NAME}"
          {
            echo "### 記事を公開しました"
            echo ""
            echo "- タイトル: ${TITLE}"
            echo "- ファイル: \`${FILE}\`"
            echo "- スラッグ: \`${SLUG}\`"
            echo "- 使用モデル: \`${MODEL}\`"
            echo "- push 先: \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
